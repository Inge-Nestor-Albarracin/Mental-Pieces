allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': set this to true or false
  prisma: set this to true or false
  unrs-resolver: false

# Security: patched transitive versions (pnpm audit, 2026-10-15).
overrides:
  proxy-addr: ^2.0.8
  qs: ^6.15.4
  body-parser: ^2.3.0
  fast-uri: ^3.1.4
  mysql2: ^3.22.0
