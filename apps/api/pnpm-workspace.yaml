allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false

# Flat node_modules (like npm). Hostinger runs the app from a copy of node_modules
# where pnpm's symlinks no longer resolve (startup failed: Cannot find module 'tslib').
nodeLinker: hoisted

# Security: patched transitive versions (pnpm audit, 2026-10-15).
overrides:
  proxy-addr: ^2.0.8
  qs: ^6.15.4
  body-parser: ^2.4.0
  multer: ^2.5.0
  # Dev/build tooling only (ts-jest, eslint, jest): advisories reviewed 2026-10-25.
  handlebars: ^4.7.10
  'brace-expansion@^1.0.0': ^1.1.20
  'brace-expansion@^2.0.0': ^2.1.6
  'brace-expansion@^5.0.0': ^5.0.11
  form-data: ^4.0.6
  'js-yaml@^3.0.0': ^3.15.2
  'js-yaml@^4.0.0': ^4.3.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  fast-uri: ^3.1.9
  mysql2: ^3.22.0
