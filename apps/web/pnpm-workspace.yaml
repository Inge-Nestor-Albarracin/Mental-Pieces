allowBuilds:
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Flat node_modules (like npm). Hostinger runs the app from a copy of node_modules
# where pnpm's symlinks no longer resolve: next could not find @swc/helpers.
nodeLinker: hoisted

# Security: patched transitive build tooling (pnpm audit, 2026-10-15).
overrides:
  browserslist: ^4.28.7
  source-map-js: ^1.2.2
  baseline-browser-mapping: ^2.11.0
  # Dev/build tooling only (eslint): advisories reviewed 2026-10-25.
  'brace-expansion@^1.0.0': ^1.1.20
  'brace-expansion@^5.0.0': ^5.0.11
  'js-yaml@^4.0.0': ^4.3.2
  postcss: ^8.5.23
  'nanoid@^3.0.0': ^3.3.18
  'zod@^4.0.0': ^4.6.6
